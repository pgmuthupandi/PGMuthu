<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 My To-Do List</h1>
            <p>Stay organized and productive</p>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <form id="todoForm">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button type="submit" class="btn btn-add">Add Task</button>
                </div>
                <div class="input-options">
                    <div class="priority-selector">
                        <label for="prioritySelect">Priority:</label>
                        <select id="prioritySelect">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    <div class="category-selector">
                        <label for="categorySelect">Category:</label>
                        <select id="categorySelect">
                            <option value="work">Work</option>
                            <option value="personal" selected>Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="filter-priority">
                <button class="priority-filter" data-priority="all" title="All Priority">All</button>
                <button class="priority-filter" data-priority="high" title="High Priority">🔴 High</button>
                <button class="priority-filter" data-priority="medium" title="Medium Priority">🟡 Medium</button>
                <button class="priority-filter" data-priority="low" title="Low Priority">🟢 Low</button>
            </div>
            <div class="sort-section">
                <select id="sortSelect">
                    <option value="date-newest">Newest First</option>
                    <option value="date-oldest">Oldest First</option>
                    <option value="priority">By Priority</option>
                    <option value="alphabetical">A-Z</option>
                </select>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value completed" id="completedTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value" id="remainingTasks">0</span>
            </div>
        </div>

        <!-- Tabs Section -->
        <div class="category-tabs">
            <button class="tab-btn active" data-category="all">All Categories</button>
            <button class="tab-btn" data-category="work">Work</button>
            <button class="tab-btn" data-category="personal">Personal</button>
            <button class="tab-btn" data-category="shopping">Shopping</button>
            <button class="tab-btn" data-category="health">Health</button>
        </div>

        <!-- Tasks List -->
        <div class="todos-section">
            <div id="todosList" class="todos-list">
                <!-- Tasks will be added here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <p class="empty-icon">📭</p>
                <p class="empty-text">No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearCompletedBtn" class="btn btn-secondary">Clear Completed</button>
            <button id="deleteAllBtn" class="btn btn-danger">Delete All</button>
            <button id="exportBtn" class="btn btn-info">Export Tasks</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Confirm Action</h2>
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirmBtn" class="btn btn-primary">Confirm</button>
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
